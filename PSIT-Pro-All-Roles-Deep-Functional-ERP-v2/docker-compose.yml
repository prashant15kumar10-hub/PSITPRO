services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: personal_assistant
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_assistant"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes: ["personal_assistant_pg:/var/lib/postgresql/data"]
volumes:
  personal_assistant_pg:
